apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: nginx-container
      image: nginx:1.29.3-alpine-slim
      ports:
        - containerPort: 80

    - name: busybox-container
      image: busybox:latest
      env:
        - name: USER
          value: "root"
        - name: PASSWORD
          value: "123456"
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "Hora atual: $(date)"
            wget -qO- http://localhost:80
            sleep 10
          done
